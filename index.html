<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ИИ Калькулятор">
<meta name="theme-color" content="#2563eb">
<title>🧮 ИИ Калькулятор</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    padding: 16px;
    background: #1e293b;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 12px 16px;
    border-radius: 16px;
    max-width: 85%;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.4;
  }
  .user {
    background: #2563eb;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .ai {
    background: #1e293b;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .ai.loading { opacity: 0.6; }
  .row {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #1e293b;
    border-top: 1px solid #334155;
    flex-shrink: 0;
  }
  input {
    flex: 1;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: #0f172a;
    color: #fff;
    font-size: 16px;
    outline: none;
    min-width: 0;
  }
  input::placeholder { color: #64748b; }
  button {
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:active { background: #1d4ed8; }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #64748b;
    padding: 6px;
    background: #1e293b;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <header>🧮 ИИ Калькулятор</header>
  <div id="chat">
    <div class="msg ai">Привет! Введи пример:
• 2 + 2 * 10
• корень из 144
• реши 2x + 5 = 17</div>
  </div>
  <div class="row">
    <input id="inp" placeholder="Введи пример..." autocomplete="off">
    <button onclick="send()">→</button>
  </div>
  <div class="hint" id="hint">Ключ API не задан</div>

<script>
  // ⚠️ ВСТАВЬ СЮДА СВОЙ КЛЮЧ С console.groq.com/keys
  const API_KEY = "";
  const API_URL = "https://api.groq.com/openai/v1/chat/completions";
  const MODEL = "llama-3.3-70b-versatile";

  const chat = document.getElementById("chat");
  const inp = document.getElementById("inp");
  const hint = document.getElementById("hint");

  if (API_KEY) hint.textContent = "✅ ИИ готов к работе";

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function tryLocal(expr) {
    if (!/^[\d\s+\-*/().,]+$/.test(expr)) return null;
    try {
      return Function('"use strict";return(' + expr.replace(/,/g, ".") + ')')();
    } catch { return null; }
  }

  async function askAI(text) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        temperature: 0,
        messages: [
          { role: "system", content: "Ты — математический калькулятор. Отвечай кратко: ответ и одна строка решения." },
          { role: "user", content: text }
        ]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.choices[0].message.content.trim();
  }

  async function send() {
    const text = inp.value.trim();
    if (!text) return;
    addMsg(text, "user");
    inp.value = "";

    const local = tryLocal(text);
    if (local !== null) {
      addMsg(String(local), "ai");
      return;
    }

    if (!API_KEY) {
      addMsg("⚠️ Ключ API не задан. Открой index.html и вставь ключ в API_KEY.", "ai");
      return;
    }

    const msg = addMsg("…", "ai loading");
    try {
      msg.textContent = await askAI(text);
      msg.classList.remove("loading");
    } catch (e) {
      msg.textContent = "⚠️ Ошибка: " + e.message;
      msg.classList.remove("loading");
    }
  }

  inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
